<!DOCTYPE html>
<html>

<head>
    <title>Default Languages</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
</head>

<body class="dialogBody">
    <div class="paddedArea">
        <table class="fill_width">
            <tr>
                <td class="noWrap middle"><label for="srcLangSelect">Default 源语言</label></td>
                <td class="fill_width middle"><select id="srcLangSelect" class="table_select"></select></td>
            </tr>
            <tr>
                <td class="noWrap middle"><label for="tgtLangSelect">Default 目标语言</label></td>
                <td class="fill_width middle"><select id="tgtLangSelect" class="table_select"></select></td>
            </tr>
        </table>
    </div>
    <div class="buttonArea">
        <button id="save">保存首选项</button>
    </div>

    <script>
        const { DefaultLanguages } = require('../../js/defaultLangs.js');
        new DefaultLanguages();
    </script>
</body>

</html>
